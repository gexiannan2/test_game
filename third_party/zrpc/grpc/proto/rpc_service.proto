syntax = "proto3";
package rpc;

option cc_generic_services = true;
option java_generic_services = true;
option py_generic_services = true;

option java_package = "rpc.protorpc";
option java_outer_classname = "RpcServiceProto";

import "rpc.proto";

message ListRpcRequest
{
    bytes service_name  = 1;
    bool list_method    = 2;
}

message ListRpcResponse
{
    ErrorCode error     = 1;
    bytes service_name  = 2;
    bytes method_name   = 3;
}

message GetServiceRequest
{
    bytes service_name  = 1;
}

message GetServiceResponse
{
    ErrorCode error                 = 1;
    repeated bytes proto_file       = 2;
    repeated bytes proto_file_name  = 3;
}

// the meta service
service RpcService
{
    rpc listRpc(ListRpcRequest) returns (ListRpcResponse);
    rpc getService(GetServiceRequest) returns (GetServiceResponse);
}
